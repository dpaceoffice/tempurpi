# The AB13X USB dongle feeding the bed is owned by CamillaDSP (tempur-dsp.service),
# which opens it as hw:Audio. Keep WirePlumber from probing or grabbing it, otherwise
# the DSP's first start after power-on fails with "Device or resource busy".
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*AB13X.*" }
      { device.product.name = "~.*AB13X.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
